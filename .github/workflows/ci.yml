name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify client and server
    runs-on: ubuntu-latest
    env:
      # Prisma validation and generation only parse this value; CI never connects to this database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/budget_ci?schema=public

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema server/prisma/schema.prisma

      - name: Validate Prisma schema
        run: npx prisma validate --schema server/prisma/schema.prisma

      - name: Type-check server
        run: npx tsc --noEmit -p server/tsconfig.json

      - name: Test server
        run: npm test --workspace=server -- --run

      - name: Test client
        run: npm test --workspace=client

      - name: Build client
        run: npm run build --workspace=client

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run browser login flow
        run: npm run test:e2e --workspace=client
